name: Talisha Software CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # CI: AUTOMATED QUALITY & TEST PIPELINE
  # ==========================================
  ci:
    name: Build & Verify (PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite, bcmath, curl
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Environment File
        run: |
          cp .env.example .env
          touch database/database.sqlite
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=database\/database.sqlite/' .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Execute Database Migrations & Seeders
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: Run Automated Test Suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test --colors=always

  # ==========================================
  # CD: PRODUCTION HOSTINGER DEPLOYMENT
  # ==========================================
  deploy:
    name: Production Deployment to Hostinger
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: "${{ env.HOSTINGER_SSH_HOST != '' }}"
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          script: |
            cd ${{ secrets.HOSTINGER_WEB_ROOT || 'public_html' }}
            git pull origin main
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            echo "🚀 Talisha Software deployed successfully to Hostinger!"

      - name: Deployment Instructions Fallback
        if: "${{ env.HOSTINGER_SSH_HOST == '' }}"
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          echo "=========================================================="
          echo "💡 Hostinger SSH deployment secrets are not configured yet."
          echo "   CI passed all automated builds and tests successfully!"
          echo "   To enable zero-downtime auto-deployment on push, add:"
          echo "   - HOSTINGER_SSH_HOST"
          echo "   - HOSTINGER_SSH_USER"
          echo "   - HOSTINGER_SSH_KEY"
          echo "   - HOSTINGER_WEB_ROOT (e.g. domains/talishasoftware.tech/public_html)"
          echo "=========================================================="
